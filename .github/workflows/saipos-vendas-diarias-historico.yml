name: SAIPOS vendas diárias histórico

concurrency:
  group: saipos-sessao
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: "Data inicial YYYY-MM-DD (default 2024-11-01)"
        type: string
        required: false
      fim:
        description: "Data final YYYY-MM-DD (default hoje)"
        type: string
        required: false

jobs:
  diarias:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Extrair vendas diárias
        env:
          SAIPOS_USER: ${{ secrets.SAIPOS_USER }}
          SAIPOS_PASS: ${{ secrets.SAIPOS_PASS }}
          SAIPOS_BASE_URL: ${{ secrets.SAIPOS_BASE_URL }}
          SAIPOS_STORE_IDS: ${{ secrets.SAIPOS_STORE_IDS }}
          DIA_INICIO: ${{ inputs.inicio }}
          DIA_FIM: ${{ inputs.fim }}
        run: node scripts/vendas_diarias_historico.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vendas-diarias
          path: vendas-diarias.csv
          if-no-files-found: warn
