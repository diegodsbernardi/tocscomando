name: SAIPOS parceiro histórico

concurrency:
  group: saipos-sessao
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      nome:
        description: "Trecho do nome do parceiro (default abra)"
        type: string
        required: false
      inicio:
        description: "Mês inicial YYYY-MM"
        type: string
        required: false

jobs:
  parceiro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Rastrear parceiro
        env:
          SAIPOS_USER: ${{ secrets.SAIPOS_USER }}
          SAIPOS_PASS: ${{ secrets.SAIPOS_PASS }}
          SAIPOS_BASE_URL: ${{ secrets.SAIPOS_BASE_URL }}
          SAIPOS_STORE_IDS: ${{ secrets.SAIPOS_STORE_IDS }}
          PARC_NOME: ${{ inputs.nome }}
          PARC_INICIO: ${{ inputs.inicio }}
        run: node scripts/parceiro_historico.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parceiro-historico
          path: parceiro-historico.csv
          if-no-files-found: warn
