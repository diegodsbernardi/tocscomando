name: SAIPOS alerta de desconto

# Não fala com o Saipos — só lê o banco. Mesmo assim entra na fila, é barato.
concurrency:
  group: saipos-sessao
  cancel-in-progress: false

on:
  # 10:30 UTC = 07:30 BRT — depois das capturas da madrugada, antes do Diego
  # começar o dia.
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alerta:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install --no-audit --no-fund

      - name: Checar alerta
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/checar_alerta_desconto.mjs

      - name: Publicar veredito no repo
        run: |
          # O arquivo é a fonte que qualquer um (inclusive um agente na nuvem,
          # que não tem as credenciais do Supabase) consegue ler.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/alerta-desconto.md
          if git diff --cached --quiet; then
            echo "veredito inalterado"
          else
            git commit -m "chore(alerta): veredito de desconto de balcao [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Resumo do run
        if: always()
        run: cat docs/alerta-desconto.md >> "$GITHUB_STEP_SUMMARY" || true
