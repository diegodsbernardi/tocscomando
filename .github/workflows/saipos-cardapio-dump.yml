name: SAIPOS cardápio dump

concurrency:
  group: saipos-sessao
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: "Mês inicial YYYY-MM (default 2025-09)"
        type: string
        required: false
      fim:
        description: "Mês final YYYY-MM"
        type: string
        required: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Baixar cardápio e vendas por item
        env:
          SAIPOS_USER: ${{ secrets.SAIPOS_USER }}
          SAIPOS_PASS: ${{ secrets.SAIPOS_PASS }}
          SAIPOS_BASE_URL: ${{ secrets.SAIPOS_BASE_URL }}
          SAIPOS_STORE_IDS: ${{ secrets.SAIPOS_STORE_IDS }}
          CARD_INICIO: ${{ inputs.inicio }}
          CARD_FIM: ${{ inputs.fim }}
        run: node scripts/cardapio_dump.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardapio-dump
          path: |
            items.json
            ingredients.json
            vendas-item.csv
          if-no-files-found: warn
