name: SAIPOS itens vendidos

on:
  # Cron em UTC. Brasil = UTC-3.
  #  02:40 UTC = 23:40 BRT — fecha o dia com o movimento quase todo.
  #  06:00 UTC = 03:00 BRT — repassa o dia anterior (day_offset -1) pra pegar
  #                          o que entrou depois da meia-noite. Upsert, não duplica.
  schedule:
    - cron: "40 2 * * *"
    - cron: "0 6 * * *"

  workflow_dispatch:
    inputs:
      date:
        description: "Data DD/MM/YYYY (opcional, default hoje)"
        type: string
        required: false
      dry_run:
        description: "Rodar em DRY_RUN (não grava no banco)"
        type: boolean
        default: false

jobs:
  vendidos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checar credenciais Saipos
        id: creds
        env:
          SAIPOS_USER: ${{ secrets.SAIPOS_USER }}
        run: |
          if [ -z "$SAIPOS_USER" ]; then
            echo "::notice::SAIPOS_USER não configurado — pulando."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: "20"
          cache: npm
      - name: Install deps
        if: steps.creds.outputs.ok == 'true'
        run: npm install --no-audit --no-fund
      - name: Install Playwright (Chromium)
        if: steps.creds.outputs.ok == 'true'
        run: npx playwright install --with-deps chromium

      - name: Capturar itens vendidos
        if: steps.creds.outputs.ok == 'true'
        env:
          SAIPOS_USER: ${{ secrets.SAIPOS_USER }}
          SAIPOS_PASS: ${{ secrets.SAIPOS_PASS }}
          SAIPOS_BASE_URL: ${{ secrets.SAIPOS_BASE_URL }}
          SAIPOS_STORE_IDS: ${{ secrets.SAIPOS_STORE_IDS }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SAIPOS_DATE: ${{ inputs.date }}
          # a passada das 06:00 UTC recaptura o dia anterior
          SAIPOS_DAY_OFFSET: ${{ github.event.schedule == '0 6 * * *' && '-1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: node scripts/itens_vendidos.mjs
